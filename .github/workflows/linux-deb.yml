name: Linux Debian package

on:
  pull_request:
    paths:
      - "linux/**"
      - "daemon/remote/**"
      - "scripts/build-linux.sh"
      - "scripts/package-deb.sh"
      - ".github/workflows/linux-deb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cargo rustc golang-go pkg-config \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            libvte-2.91-gtk4-0 libgtk4-layer-shell-dev \
            blueprint-compiler libxml2-utils xz-utils \
            dpkg-dev desktop-file-utils appstream lintian

      - name: Install Zig
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          sudo tar -C /opt -xf /tmp/zig.tar.xz
          echo "/opt/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Build Linux artifacts
        run: ./scripts/build-linux.sh

      - name: Test Linux socket protocol
        run: cargo test --manifest-path linux/cmux-gtk/Cargo.toml

      - name: Package deb
        run: ./scripts/package-deb.sh --version 0.1.0

      - name: Validate package
        run: |
          set -euo pipefail
          DEB="$(find dist/deb -name 'cmux_*.deb' -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          lintian "$DEB" || true
